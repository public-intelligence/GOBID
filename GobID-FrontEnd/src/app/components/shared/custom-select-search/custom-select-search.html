<div class="relative flex flex-col gap-0.5">
  @if (label()) {
    <label [for]="id()" class="label">
      {{ label() }}
      @if (required()) {
        <span class="ml-0.5 text-alert-error">*</span>
      }
    </label>
  }

  <button
    #triggerBtn
    [id]="id()"
    type="button"
    [class]="triggerClasses()"
    (click)="toggleOpen()"
    (keydown.escape)="close()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-invalid]="hasError() ? 'true' : null"
    [attr.aria-describedby]="hasError() ? errorId() : null"
    aria-haspopup="listbox"
  >
    <span class="truncate">
      {{ selectedLabel() || placeholder() }}
    </span>
    @if (value() && !disabled()) {
      <span
        role="button"
        tabindex="0"
        aria-label="Limpiar selección"
        class="shrink-0 rounded p-0.5 text-gray-400 hover:text-gray-600"
        (click)="clearSelection($event)"
        (keydown.enter)="clearSelection($event)"
        (keydown.space)="clearSelection($event)"
      >
        <svg class="size-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M4.28 3.22a.75.75 0 0 0-1.06 1.06L6.94 8l-3.72 3.72a.75.75 0 1 0 1.06 1.06L8 9.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L9.06 8l3.72-3.72a.75.75 0 0 0-1.06-1.06L8 6.94 4.28 3.22z"
          />
        </svg>
      </span>
    } @else {
      <svg
        class="size-4 shrink-0 text-gray-400 transition-transform duration-150"
        [class.rotate-180]="isOpen()"
        viewBox="0 0 16 16"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06z"
        />
      </svg>
    }
  </button>

  @if (isOpen()) {
    <div
      class="fixed inset-0 z-40"
      role="button"
      tabindex="0"
      aria-label="Cerrar"
      (click)="close()"
      (keydown.enter)="close()"
      (keydown.space)="close()"
      (keydown.escape)="close()"
    ></div>

    <div
      class="fixed z-50 mt-1 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-md"
      [style.top]="dropdownStyle().top"
      [style.left]="dropdownStyle().left"
      [style.width]="dropdownStyle().width"
    >
      <div class="border-b border-gray-100 p-2 text-base">
        <input
          type="text"
          [placeholder]="searchPlaceholder()"
          [value]="searchQuery()"
          (input)="onSearch($event)"
          (click)="$event.stopPropagation()"
          (keydown.escape)="close()"
          class="w-full"
        />
      </div>

      <ul class="max-h-48 overflow-y-auto p-2 custom-scrollbar" role="listbox">
        @for (option of filteredOptions(); track option.value) {
          <li
            role="option"
            [attr.aria-selected]="option.value === value()"
            tabindex="0"
            (click)="selectOption(option)"
            (keydown.enter)="selectOption(option)"
            class="mb-1 cursor-pointer rounded-lg border px-4 py-2 text-sm text-gray-600 duration-200 hover:bg-slate-100"
            [class.bg-primary-blue-lighter]="option.value === value()"
            [class.border-primary-blue]="option.value === value()"
            [class.text-primary-blue]="option.value === value()"
            [class.border-slate-200]="option.value !== value()"
          >
            {{ option.label }}
          </li>
        } @empty {
          <li class="px-4 py-2 text-sm text-gray-400">Sin resultados</li>
        }
      </ul>
    </div>
  }

  @if (hasError()) {
    <p [id]="errorId()" class="ml-1 flex items-center gap-1 text-xs text-alert-error" aria-live="polite">
      <svg class="size-3 shrink-0" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path
          d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3.5a.75.75 0 0 1-1.5 0V5zm.75 7a.875.875 0 1 1 0-1.75A.875.875 0 0 1 8 12z"
        />
      </svg>
      {{ errorMessage() }}
    </p>
  }
</div>
