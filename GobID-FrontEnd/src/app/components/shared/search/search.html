<div class="relative w-full">
  <!-- Search Icon inside input -->
  <div
    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"
  >
    <fa-icon [icon]="faSearch" class="text-[0.9rem]"></fa-icon>
  </div>

  @if (mask === '') {
  <input
    type="text"
    id="search-input"
    name="search-input"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    (input)="onChangeValue($event)"
    class="block w-full rounded-lg border border-gray-200 bg-gray-50 py-2 pr-10 pl-10 text-sm text-gray-900 transition-all outline-none placeholder:text-gray-400 hover:border-gray-300 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20"
    [ngClass]="{ 'opacity-75 bg-blue-50 border-blue-200 pointer-events-none': flag(), 'border-red-500 focus:border-red-500 focus:ring-red-500/20': errMsg }"
    autocomplete="off"
    (keydown.enter)="onEnterSearch()"
    (keydown.escape)="clearSearch()"
  />
  } @else {
  <input
    type="text"
    id="search-input"
    name="search-input"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    (input)="onChangeValue($event)"
    class="block w-full rounded-lg border border-gray-200 bg-gray-50 py-2 pr-10 pl-10 text-sm text-gray-900 transition-all outline-none placeholder:text-gray-400 hover:border-gray-300 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20"
    [ngClass]="{ 'opacity-75 bg-blue-50 border-blue-200 pointer-events-none': flag(), 'border-red-500 focus:border-red-500 focus:ring-red-500/20': errMsg }"
    autocomplete="off"
    [mask]="mask"
    (keydown.enter)="onEnterSearch()"
    (keydown.escape)="clearSearch()"
  />
  }

  <!-- Status / Clear Icons -->
  <div class="absolute inset-y-0 right-0 flex items-center pr-2">
    @if (!flag() && value()) {
    <button
      type="button"
      (click)="onSearchValue()"
      class="flex h-7 w-7 items-center justify-center rounded-md bg-transparent text-gray-400 normal-case transition-colors hover:bg-gray-100 hover:text-blue-600 focus:outline-none"
      title="Buscar"
    >
      Buscar
    </button>
    } @else if (flag()) {
    <button
      type="button"
      (click)="clearSearch()"
      class="flex h-7 w-7 items-center justify-center rounded-md bg-transparent text-blue-500 normal-case transition-colors hover:bg-red-50 hover:text-red-500 focus:outline-none"
      title="Limpiar búsqueda"
    >
      <fa-icon [icon]="faX" class="text-[0.8rem]"></fa-icon>
    </button>
    }
  </div>

  @if(errMsg) {
  <p class="absolute -bottom-5 left-0 text-[0.75rem] font-medium text-red-500">
    {{ errMsg }}
  </p>
  }
</div>
