<section
  (appClickOutside)="closeFilter()"
  class="flex w-full flex-col items-center gap-3 sm:flex-row"
>
  @for (filter of filters; track $index) {
  <div class="relative w-full sm:w-auto">
    <button
      type="button"
      class="flex w-full min-w-[14rem] items-center justify-between gap-3 rounded-lg border border-gray-200 bg-gray-50 px-4 py-2 text-sm font-medium text-gray-900 normal-case transition-all hover:border-gray-300 hover:bg-white focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none sm:w-auto"
      (click)="toggleFilter(filter.controlName)"
    >
      <span class="truncate">
        <span class="mr-1 text-gray-500">{{ filter.title }}:</span>
        <span>{{ filterSelected()[filter.controlName] }}</span>
      </span>
      <fa-icon
        [icon]="faAngleDown"
        class="text-gray-400 transition-transform duration-200"
        [ngClass]="{'rotate-180': openFilter() === filter.controlName}"
      ></fa-icon>
    </button>

    @if (openFilter() === filter.controlName) {
    <div
      class="absolute top-[calc(100%+0.5rem)] left-0 z-50 flex w-full min-w-[14rem] flex-col overflow-hidden rounded-lg border border-gray-100 bg-white shadow-lg sm:w-auto"
    >
      <div class="max-h-60 overflow-y-auto py-1">
        @for (item of filter.values; track $index) {
        <button
          type="button"
          class="flex w-full items-center px-4 py-2.5 text-left text-sm font-normal normal-case transition-colors hover:bg-blue-50 hover:text-blue-700"
          [ngClass]="filterSelected()[filter.controlName] === item.label ? 'bg-blue-50/50 font-medium text-blue-700' : 'bg-transparent text-gray-700'"
          (click)="applyFilters(filter.controlName, item.label)"
        >
          {{ item.label }}
        </button>
        }
      </div>
    </div>
    }
  </div>
  }
</section>
