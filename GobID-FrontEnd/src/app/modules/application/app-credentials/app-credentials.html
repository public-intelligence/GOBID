<app-confirmation-modal />
<app-create-credential-modal
  [applicationId]="applicationId"
  (created)="loadCredentials()"
/>
<app-maintenance
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [isLoading]="isLoading()"
  [showFilters]="false"
  [showPaginator]="false"
  [showButton]="true"
  [buttonText]="'Agregar Credencial'"
  [onCreate]="openCreateModal.bind(this)"
  [canCreate]="true"
  [canEdit]="false"
/>
