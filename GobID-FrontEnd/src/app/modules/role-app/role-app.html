<app-maintenance
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [showButton]="false"
  [isLoading]="isLoading()"
  (searchValue)="onSearchChange($event)"
  [showPaginator]="true"
  [pageNumber]="rolAppFilter().pageNumber || 1"
  (pageSize)="onPageSizeChange($event)"
  [totalCount]="totalCount()"
  [totalPages]="totalPages()"
  (actualPage)="onPageChange($event)"
  [pageSizeInput]="rolAppFilter().pageSize || 10"
/>
