<app-confirmation-modal></app-confirmation-modal>
<app-maintenance
  [createPath]="'/organizations/create'"
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [buttonText]="'Nueva Organización'"
  [isLoading]="isLoading()"
  (searchValue)="onSearchChange($event)"
  [filters]="filters"
  (filterSelected)="onFiltersChange($event)"
  [showFilters]="true"
  [showPaginator]="true"
  [pageNumber]="organizationFilter().pageNumber || 1"
  (pageSize)="onPageSizeChange($event)"
  [totalCount]="totalCount()"
  [totalPages]="totalPages()"
  (actualPage)="onPageChange($event)"
  [pageSizeInput]="organizationFilter().pageSize || 10"
/>
