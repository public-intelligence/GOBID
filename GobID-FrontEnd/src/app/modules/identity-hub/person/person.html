<app-confirmation-modal />
<app-maintenance
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [createPath]="createPath"
  [isLoading]="isLoading()"
  (searchValue)="valueToSearchChange($event)"
  [filters]="filters"
  (filterSelected)="statusValue($event)"
  [showFilters]="true"
  [showPaginator]="true"
  [pageNumber]="personFilter().pageNumber || 1"
  (pageSize)="pageSize($event)"
  [totalCount]="totalCount()"
  [totalPages]="totalPages()"
  (actualPage)="actualPage($event)"
  [pageSizeInput]="personFilter().pageSize || 10"
/>
