<app-confirmation-modal />
<app-maintenance
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [isLoading]="isLoading()"
  [showButton]="false"
  (searchValue)="onSearchChange($event)"
  [showFilters]="true"
  [filters]="appFilters()"
  (filterSelected)="onFiltersChange($event)"
  [showPaginator]="true"
  [pageNumber]="sessionFilters().pageNumber || 1"
  (pageSize)="onPageSizeChange($event)"
  [totalCount]="totalCount()"
  [totalPages]="totalPages()"
  (actualPage)="onPageChange($event)"
  [pageSizeInput]="sessionFilters().pageSize || 10"
/>

<div class="mt-4 flex flex-wrap gap-6">
  <button
    class="bg-primary-red flex w-full items-center justify-center gap-2 hover:bg-[#c0392b] sm:w-fit"
    (click)="showRevokeAllConfirmation()"
  >
    Revocar todas las sesiones
  </button>

  <button
    class="bg-primary-red flex w-full items-center justify-center gap-2 hover:bg-[#c0392b] disabled:cursor-not-allowed disabled:opacity-50 sm:w-fit"
    [disabled]="!selectedApplicationId"
    (click)="showRevokeByAppConfirmation()"
  >
    Revocar sesiones por aplicación
  </button>
</div>
