<app-confirmation-modal />

@if (isSuperAdmin) {
<div class="mb-6">
  <label class="label" for="orgSelect">Seleccione una Organización</label>
  <select
    id="orgSelect"
    class="input w-full max-w-sm"
    (change)="onOrganizationChange($event)"
  >
    @for (opt of organizationOptions(); track opt.value) {
    <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
</div>
}

@if (selectedOrganizationId()) {
<app-maintenance
  [headers]="headers"
  [columnData]="tableData()"
  [title]="title"
  [createPath]="createPath"
  [isLoading]="isLoading()"
  [buttonText]="'Nuevo Personal'"
  (searchValue)="onSearchChange($event)"
  (filterSelected)="onFiltersChange($event)"
  [filters]="filters"
  [showFilters]="true"
  [showPaginator]="true"
  [pageNumber]="personnelFilters().pageNumber || 1"
  (pageSize)="onPageSizeChange($event)"
  [totalCount]="totalCount()"
  [totalPages]="totalPages()"
  (actualPage)="onPageChange($event)"
  [pageSizeInput]="personnelFilters().pageSize || 10"
/>
}
