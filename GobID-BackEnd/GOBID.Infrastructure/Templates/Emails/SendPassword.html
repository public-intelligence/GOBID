<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOBID - Credenciales</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, sans-serif; color:#333;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:30px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                       style="background:#ffffff; padding:30px; border-radius:8px;">

                    <!-- Título -->
                    <tr>
                        <td align="center"
                            style="font-size:24px; font-weight:bold; color:#003876; padding-bottom:20px;">
                            Información de acceso a GOBID
                        </td>
                    </tr>

                    <!-- Texto inicial -->
                    <tr>
                        <td style="font-size:15px; line-height:1.5; padding-bottom:10px;">
                            Saludos,
                        </td>
                    </tr>

                    <tr>
                        <td style="font-size:15px; line-height:1.5;">
                            Este correo es para informarle que sus credenciales de GOBID son las siguientes:
                        </td>
                    </tr>

                    <!-- Tabla de credenciales -->
                    <tr>
                        <td style="padding-top:20px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                                <tr>
                                    <td style="width:35%; font-weight:bold; background:#f0f4fa;
                                               border:1px solid #e5e5e5; padding:12px; font-size:15px;">
                                        Usuario
                                    </td>
                                    <td style="border:1px solid #e5e5e5; padding:12px; font-size:15px;">
                                        {{UserName}}
                                    </td>
                                </tr>

                                {{PasswordRow}}
                            </table>
                        </td>
                    </tr>

                    <!-- Aplicaciones dinámicas -->
                    <tr>
                        <td style="padding-top:20px;">
                            {{Applications}}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding-top:30px; font-size:12px; color:#666; text-align:center; line-height:1.5;">
                            Si tienes alguna inquietud o duda, por favor contacta con el departamento de tecnología de tu organización.
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
